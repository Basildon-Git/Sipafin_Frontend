<section class="gallery-showcase" #galleryRoot>

  </div>

  <div class="gallery-grid">

      <div class="gallery-overlay">

          <span>Daily, weekly and corporate rentals</span>
        </figcaption>
      </div>
    </figure>

    <figure class="gallery-card reveal photo-team">

        <i class="bi bi-people"></i>
